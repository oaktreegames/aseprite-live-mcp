name: CI

# Every push and PR runs lint + the unit/wire test suite on all three OSes,
# on both the declared Python floor (3.10) and a current Python. The suite
# needs no Aseprite binary: the headless integration test skips itself when
# Aseprite is absent, and the wire-validation tests drive a real MCP client
# session in-process.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (lint + format check)
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool docs match the code (gen_docs --check)
        run: |
          python -m pip install .
          python scripts/gen_docs.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Tests (unit + real-client wire validation)
        run: python -m pytest tests/ -q

name: Publish to PyPI

# Publishes the package to PyPI via Trusted Publishing (OIDC) — no API token is
# stored anywhere. PyPI must have a matching publisher configured under the project's
# Publishing settings:
#   Owner:       oaktreegames
#   Repository:  aseprite-live-mcp
#   Workflow:    publish.yml
#   Environment: (none)
#
# Trigger it either by clicking "Run workflow" in the Actions tab (workflow_dispatch),
# or by pushing a version tag like v0.1.0.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # REQUIRED for Trusted Publishing (OIDC); do not remove
      contents: read   # REQUIRED so actions/checkout can clone the repo
                       # (declaring `permissions` sets every unlisted scope to none)
    steps:
      - uses: actions/checkout@v7

      # Test on 3.10 — the declared floor — so a typing/runtime break on older
      # Pythons can never ship silently (the suite needs no Aseprite binary;
      # the headless integration test skips itself when Aseprite is absent).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test on the Python floor
        run: |
          python -m pip install ".[dev]"
          python -m pytest tests/ -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # On tag pushes, also cut a GitHub Release whose body is that version's
  # CHANGELOG section — so the Releases tab always mirrors the changelog.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release (job-scoped; the publish job stays read-only)
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # index() substring match — no regex built from strings, no escaping traps
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          # Never ship an empty body: fall back to a pointer at the changelog.
          [ -s release-notes.md ] || echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --repo "$GITHUB_REPOSITORY"
